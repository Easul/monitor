# Required repository secrets for signed release builds:
# - KEYSTORE_BASE64: base64-encoded release keystore file
# - KEYSTORE_PASSWORD: keystore password
# - KEY_ALIAS: release key alias
# - KEY_PASSWORD: release key password
#
# No repository variables are required. The workflow uses versionCode = 5000 +
# origin/main commit count and versionName = <tag-or-input>+<commit6>.
# Push a v* tag to create a GitHub Release, or run workflow_dispatch to build
# and upload APK artifacts only.

name: Release Android APK

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the release title, for example v1.0.0'
        required: true
        default: 'v1.0.0'

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    outputs:
      commit_hash: ${{ steps.version.outputs.commit_hash }}
      version: ${{ steps.version.outputs.version }}
      build_version: ${{ steps.version.outputs.build_version }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get version info
        id: version
        run: |
          COMMIT_HASH=$(git rev-parse HEAD | cut -c1-6)

          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          COMMIT_COUNT=$(git rev-list --count origin/main)
          VERSION_CODE=$((5000 + COMMIT_COUNT))
          BUILD_VERSION="${VERSION}+${COMMIT_HASH}"

          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"
          echo "Commit: ${COMMIT_HASH}"
          echo "Build version: ${BUILD_VERSION}"
          echo "Version code: ${VERSION_CODE}"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is not set"
            exit 1
          fi

          mkdir -p temp/signing
          echo "$KEYSTORE_BASE64" | base64 -d > temp/signing/lightly-monitor-release.jks
          test -s temp/signing/lightly-monitor-release.jks

      - name: Create signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets are required"
            exit 1
          fi

          {
            printf 'storeFile=temp/signing/lightly-monitor-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > temp/signing/signing.properties

      - name: Locate Android build tools
        id: build-tools
        run: |
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "dir=${BUILD_TOOLS_DIR}" >> "$GITHUB_OUTPUT"
          echo "Build tools: ${BUILD_TOOLS_DIR}"

      - name: Build signed APKs
        env:
          BUILD_TOOLS_DIR: ${{ steps.build-tools.outputs.dir }}
          SIGNING_PROPERTIES: temp/signing/signing.properties
          OUTPUT_DIR: app/release
          ABIS: arm64-v8a armeabi-v7a
          BUILD_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          BUILD_VERSION_NAME: ${{ steps.version.outputs.build_version }}
        run: |
          chmod +x ./gradlew scripts/package_release_apks.sh
          scripts/package_release_apks.sh

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/release/app-release-arm64-v8a-signed.apk dist/app-release-arm64-v8a-signed.apk
          cp app/release/app-release-armeabi-v7a-signed.apk dist/app-release-armeabi-v7a-signed.apk
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*.apk
          retention-days: 7

  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Android Release ${{ github.ref_name }}

            ### 下载 APK

            根据设备架构选择安装包：

            | 文件名 | 架构 | 适用设备 |
            | --- | --- | --- |
            | `app-release-arm64-v8a-signed.apk` | ARM64 (64 位) | 大多数现代 Android 设备 |
            | `app-release-armeabi-v7a-signed.apk` | ARMv7 (32 位) | 老旧设备或低内存设备 |

            ### 安装说明

            1. 下载适合设备架构的 APK
            2. 允许安装未知来源应用
            3. 安装 APK；重复安装时可使用 `adb install -r` 保留数据

            ### 功能特性

            - 支持 Monitor 自有 EasyTier VPN 与复用 Lightly EasyTier VPN
            - 支持被控端发现、WebRTC 双向语音、远端摄像头画面
            - 支持 Mimo AI 画面分析与语音播报
            - 发布包提供 arm64-v8a 与 armeabi-v7a 两个 ABI 分包

            ### 版本信息

            - 版本: ${{ needs.build-android.outputs.build_version }}
            - versionCode: ${{ needs.build-android.outputs.version_code }}
            - 提交: ${{ needs.build-android.outputs.commit_hash }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
