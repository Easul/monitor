plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { namespace 'lightly.monitor'; compileSdk 34
    def abiFilterProperty = providers.gradleProperty('abiFilters').orNull
    def packagedAbis = abiFilterProperty ? abiFilterProperty.split(',').collect { it.trim() }.findAll { !it.isEmpty() } : ['arm64-v8a', 'armeabi-v7a']
    def configuredVersionCode = providers.gradleProperty('buildVersionCode')
        .orElse(providers.environmentVariable('BUILD_VERSION_CODE'))
        .orElse('1')
        .get()
        .toInteger()
    def configuredVersionName = providers.gradleProperty('buildVersionName')
        .orElse(providers.environmentVariable('BUILD_VERSION_NAME'))
        .orElse('1.0.0')
        .get()
    defaultConfig { applicationId 'lightly.monitor'; minSdk 21; targetSdk 34; versionCode configuredVersionCode; versionName configuredVersionName; ndk { abiFilters(*packagedAbis) } }
    buildTypes { debug { minifyEnabled false }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.7.0'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'io.github.webrtc-sdk:android:125.6422.03'
}
